name: win64_vulkan_loader_builder

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: dockcross/windows-shared-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive 
          fetch-depth: 1 

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git python3 python3-pip

      - name: Build Vulkan Headers & Loader
        working-directory: ./Vulkan-Loader
        run: |
          ls
          cmake -S . -B build -D UPDATE_DEPS=On -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan_loader_mingW_win64
          path: |
            Vulkan-Loader/build/loader/*.so
            Vulkan-Loader/build/loader/*.dll
            Vulkan-Loader/build/loader/*.pc
            Vulkan-Loader/build/loader/*.dll.a
