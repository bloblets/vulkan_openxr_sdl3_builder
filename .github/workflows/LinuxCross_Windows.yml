name: win64_vulkan_loader_builder

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: dockcross/windows-static-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git python3 python3-pip

      - name: Build Vulkan Headers & Loader
        working-directory: ./Vulkan-Loader
        run: |
          ls
          cmake -S . -B build -D UPDATE_DEPS=On -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Archive artifacts
        working-directory: ./Vulkan-Loader
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan_loader_mingW_win64
          path: build/
