name: win64_vulkan_loader_builder

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git ninja-build libglfw3-dev python3 python3-pip

      - name: Build Vulkan Headers & Loader
        run: |

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan_loader_mingW_win64
          path: build/
